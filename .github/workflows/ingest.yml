name: Ingest

# Daily incremental ingestion into the production graph (Neo4j Aura).
# Required repository secrets: GUARDIAN_API_KEY, NEO4J_URI, NEO4J_USER, NEO4J_PASSWORD, NEO4J_DATABASE
# (Aura names the database after the instance id; see NEO4J_DATABASE in the Aura credentials file).
on:
  schedule:
    - cron: "17 6 * * *"   # 06:17 UTC daily (off the hour to avoid GitHub's top-of-hour queue)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Extract and link, but do not write to Neo4j"
        type: boolean
        default: false

permissions:
  contents: read

# Explicit bash = `bash -eo pipefail`, so a failing command in a pipe fails the step.
defaults:
  run:
    shell: bash

# Never run two ingestions against the same graph at once; queue instead of cancelling.
concurrency:
  group: ingest-production
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LOG_FORMAT: json
      GUARDIAN_API_KEY: ${{ secrets.GUARDIAN_API_KEY }}
      NEO4J_URI: ${{ secrets.NEO4J_URI }}
      NEO4J_USER: ${{ secrets.NEO4J_USER }}
      NEO4J_PASSWORD: ${{ secrets.NEO4J_PASSWORD }}
      NEO4J_DATABASE: ${{ secrets.NEO4J_DATABASE }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Ensure schema (idempotent)
        run: python -m graphdb.apply_schema
      - name: Ingest
        run: python -m scripts.ingest ${{ inputs.dry_run && '--dry-run' || '' }}
      - name: Run summary
        if: always()
        run: |
          if [ -f data/exports/ingest_summary.json ]; then
            { echo '### Ingest summary'; echo '```json'; cat data/exports/ingest_summary.json; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          fi
      # Event keys for the RMI lane. ingest_batch.json is not uploaded: it holds Guardian sentences.
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: event-keys-${{ github.run_id }}
          path: |
            data/exports/event_keys.csv
            data/exports/ingest_summary.json
          if-no-files-found: ignore
          retention-days: 30
