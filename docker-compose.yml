# Local Neo4j alternative. Aura free is the working instance for this project.
# This Compose path has not been executed on the current machine because Docker
# is not available in the development shell. See contributions/person-b-graphdb/.
services:
  neo4j:
    image: neo4j:5.26.32-community
    container_name: temporal-knowledge-graph-neo4j
    restart: unless-stopped
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:?Set NEO4J_PASSWORD in .env}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test:
        - CMD-SHELL
        - "cypher-shell -u \"$${NEO4J_USER}\" -p \"$${NEO4J_PASSWORD}\" 'RETURN 1' >/dev/null 2>&1 || exit 1"
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s

volumes:
  neo4j_data:
  neo4j_logs:
